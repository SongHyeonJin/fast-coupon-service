spring:
  autoconfigure:
    # MockMvc의 MockHttpSession을 Spring Session 필터가 가로채지 않도록 테스트에서는 제외
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3306/jin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    consumer:
      group-id: test-group-${random.uuid}
      auto-offset-reset: latest